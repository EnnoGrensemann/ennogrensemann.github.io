<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minecraft Minesweeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121212;
      --mc-gui: #c6c6c6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 6px;
    }

    header h1 {
      font-size: 13px;
      color: #ddd;
      text-shadow: 2px 2px #000;
      margin-bottom: 8px;
    }

    .stats-card {
      background: #212121;
      border: 3px solid #000;
      box-shadow: inset 2px 2px #444, inset -2px -2px #111;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 8px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 380px;
    }

    .stat-val {
      color: #ffaa00;
    }

    .controls-panel {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 380px;
    }

    .mc-btn {
      background: #727272;
      border: 3px solid #000;
      box-shadow: inset 2px 2px #aaa, inset -2px -2px #333;
      color: #fff;
      font-family: inherit;
      font-size: 8px;
      padding: 8px 4px;
      cursor: pointer;
      text-align: center;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .mc-btn:active, .mc-btn.active {
      box-shadow: inset -2px -2px #aaa, inset 2px 2px #222;
      background: #4a4a4a;
      color: #55ff55;
    }

    .mc-select {
      background: #333;
      color: #fff;
      border: 3px solid #000;
      font-family: inherit;
      font-size: 8px;
      padding: 6px;
    }

    #board-wrapper {
      width: 100%;
      max-width: 100vw;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 2px;
    }

    #board {
      display: grid;
      gap: 1px;
      background: #111;
      padding: 3px;
      border: 4px solid #3c3c3c;
    }

    .cell {
      position: relative;
      background-size: cover;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      cursor: pointer;
    }

    .cell.revealed {
      filter: brightness(0.72) contrast(1.1);
    }

    .cell.flagged::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.18.2/assets/minecraft/textures/item/water_bucket.png');
      background-size: 80%;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .cell.lava {
      background-image: url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.18.2/assets/minecraft/textures/block/lava_still.png') !important;
      background-size: cover !important;
      filter: none !important;
    }

    .num-1 { color: #55ff55; }
    .num-2 { color: #ffff55; }
    .num-3 { color: #ffaa00; }
    .num-4 { color: #ff5555; }
    .num-5 { color: #aa00aa; }
    .num-6 { color: #00aaaa; }
    .num-7 { color: #ffffff; }
    .num-8 { color: #777777; }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    #modal-box {
      background: #2b2b2b;
      border: 4px solid #000;
      padding: 16px;
      text-align: center;
      max-width: 320px;
    }

    #modal-box h2 {
      font-size: 11px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    #modal-box p {
      font-size: 8px;
      margin-bottom: 14px;
      color: #bbb;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>MINECRAFT MINESWEEPER</h1>
  </header>

  <div class="stats-card">
    <div>Y: <span id="depth-display" class="stat-val">64</span></div>
    <div>ORT: <span id="layer-name" class="stat-val">GRAS</span></div>
    <div>LAVA: <span id="lava-left" class="stat-val">0</span></div>
  </div>

  <div class="controls-panel">
    <select id="size-selector" class="mc-select">
      <option value="8" selected>8x8</option>
      <option value="16">16x16</option>
      <option value="32">32x32</option>
    </select>
    <button id="mode-btn" class="mc-btn">MODUS: ⛏️ ABBAUEN</button>
    <button id="reset-btn" class="mc-btn">NEUSTART</button>
  </div>

  <div id="board-wrapper">
    <div id="board"></div>
  </div>

  <div id="modal">
    <div id="modal-box">
      <h2 id="modal-title"></h2>
      <p id="modal-msg"></p>
      <button id="modal-action-btn" class="mc-btn">WEITER</button>
    </div>
  </div>

  <script>
    const ASSET_BASE = "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.18.2/assets/minecraft/textures/block/";

    const LAYERS = [
      { maxDepth: 63, name: "GRAS", texture: ASSET_BASE + "grass_block_top.png" },
      { maxDepth: 55, name: "ERDE", texture: ASSET_BASE + "dirt.png" },
      { maxDepth: 0,  name: "STEIN", texture: ASSET_BASE + "stone.png" },
      { maxDepth: -58, name: "TIEFSCHIEFER", texture: ASSET_BASE + "deepslate.png" },
      { maxDepth: -Infinity, name: "BEDROCK", texture: ASSET_BASE + "bedrock.png" }
    ];

    let currentY = 64;
    let gridSize = 8;
    let totalBombs = 0;
    let board = [];
    let revealedCount = 0;
    let flagsPlaced = 0;
    let firstClick = true;
    let gameOver = false;
    let isFlagMode = false;

    const boardEl = document.getElementById("board");
    const depthDisplay = document.getElementById("depth-display");
    const layerName = document.getElementById("layer-name");
    const lavaLeft = document.getElementById("lava-left");
    const modeBtn = document.getElementById("mode-btn");
    const resetBtn = document.getElementById("reset-btn");
    const sizeSelector = document.getElementById("size-selector");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modal-title");
    const modalMsg = document.getElementById("modal-msg");
    const modalActionBtn = document.getElementById("modal-action-btn");

    function getCurrentLayer() {
      return LAYERS.find(l => currentY >= l.maxDepth) || LAYERS[LAYERS.length - 1];
    }

    function calculateBombCount() {
      const totalCells = gridSize * gridSize;
      let density = 0.12;
      if (currentY < 55) density = 0.15;
      if (currentY < 0)  density = 0.18;
      if (currentY < -40) density = 0.22;
      return Math.max(1, Math.floor(totalCells * density));
    }

    function initGame(resetToTop = true) {
      if (resetToTop) {
        currentY = 64;
      }
      gridSize = parseInt(sizeSelector.value, 10);
      totalBombs = calculateBombCount();
      board = [];
      revealedCount = 0;
      flagsPlaced = 0;
      firstClick = true;
      gameOver = false;
      modal.style.display = "none";

      const layer = getCurrentLayer();
      depthDisplay.textContent = currentY;
      layerName.textContent = layer.name;
      lavaLeft.textContent = totalBombs;

      const cellSize = gridSize === 32 ? 22 : gridSize === 16 ? 28 : 38;
      const fontSize = gridSize === 32 ? 7 : gridSize === 16 ? 9 : 11;

      boardEl.style.gridTemplateColumns = `repeat(${gridSize}, ${cellSize}px)`;
      boardEl.innerHTML = "";

      for (let r = 0; r < gridSize; r++) {
        board[r] = [];
        for (let c = 0; c < gridSize; c++) {
          board[r][c] = {
            r, c,
            isBomb: false,
            revealed: false,
            flagged: false,
            adjacentBombs: 0
          };

          const cell = document.createElement("div");
          cell.className = "cell";
          cell.style.width = `${cellSize}px`;
          cell.style.height = `${cellSize}px`;
          cell.style.fontSize = `${fontSize}px`;
          cell.style.backgroundImage = `url('${layer.texture}')`;
          cell.dataset.r = r;
          cell.dataset.c = c;

          attachCellEvents(cell, r, c);
          boardEl.appendChild(cell);
        }
      }
    }

    function attachCellEvents(el, r, c) {
      let touchStartTime = 0;
      let longPressFired = false;
      let longPressTimer = null;

      el.addEventListener("touchstart", (e) => {
        touchStartTime = Date.now();
        longPressFired = false;
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          toggleFlag(r, c);
        }, 320);
      }, { passive: true });

      el.addEventListener("touchmove", () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      });

      el.addEventListener("touchend", (e) => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        if (!longPressFired && (Date.now() - touchStartTime < 320)) {
          e.preventDefault();
          executeAction(r, c);
        }
      });

      el.addEventListener("click", () => {
        if (!longPressFired) {
          executeAction(r, c);
        }
      });

      el.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        toggleFlag(r, c);
      });
    }

    function executeAction(r, c) {
      if (gameOver) return;
      if (isFlagMode) {
        toggleFlag(r, c);
      } else {
        revealCell(r, c);
      }
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const data = board[r][c];
      if (data.revealed) return;

      const el = getCellElement(r, c);
      data.flagged = !data.flagged;

      if (data.flagged) {
        flagsPlaced++;
        el.classList.add("flagged");
      } else {
        flagsPlaced--;
        el.classList.remove("flagged");
      }

      lavaLeft.textContent = totalBombs - flagsPlaced;
    }

    function placeBombs(excludeR, excludeC) {
      let placed = 0;
      while (placed < totalBombs) {
        const rr = Math.floor(Math.random() * gridSize);
        const cc = Math.floor(Math.random() * gridSize);
        const isNeighbor = Math.abs(rr - excludeR) <= 1 && Math.abs(cc - excludeC) <= 1;

        if (!board[rr][cc].isBomb && !isNeighbor) {
          board[rr][cc].isBomb = true;
          placed++;
        }
      }

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (!board[r][c].isBomb) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && board[nr][nc].isBomb) {
                  count++;
                }
              }
            }
            board[r][c].adjacentBombs = count;
          }
        }
      }
    }

    function revealCell(r, c) {
      const data = board[r][c];
      if (data.revealed || data.flagged || gameOver) return;

      if (firstClick) {
        firstClick = false;
        placeBombs(r, c);
      }

      const el = getCellElement(r, c);

      if (data.isBomb) {
        triggerGameOver();
        return;
      }

      data.revealed = true;
      revealedCount++;
      el.classList.add("revealed");

      if (data.adjacentBombs > 0) {
        el.textContent = data.adjacentBombs;
        el.classList.add(`num-${data.adjacentBombs}`);
      } else {
        el.textContent = "";
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
              revealCell(nr, nc);
            }
          }
        }
      }

      checkLevelComplete();
    }

    function checkLevelComplete() {
      const targetReveals = (gridSize * gridSize) - totalBombs;
      if (revealedCount >= targetReveals) {
        gameOver = true;
        currentY--;
        showModal(
          "EBENE GESCHAFFT!",
          `Schicht Y: ${currentY + 1} abgebaut.<br>Grabe weiter nach Y: ${currentY}!`,
          "TIEFER GRABEN ⛏️",
          () => initGame(false)
        );
      }
    }

    function triggerGameOver() {
      gameOver = true;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const data = board[r][c];
          const el = getCellElement(r, c);

          if (data.isBomb) {
            el.classList.add("lava");
          } else if (data.flagged) {
            el.classList.remove("flagged");
            el.textContent = "❌";
          }
        }
      }

      showModal(
        "IN LAVA GEFALLEN!",
        `Deine Reise endete bei Tiefe Y: ${currentY}.`,
        "NEUER VERSUCH",
        () => initGame(true)
      );
    }

    function showModal(title, msg, btnText, action) {
      modalTitle.innerHTML = title;
      modalMsg.innerHTML = msg;
      modalActionBtn.textContent = btnText;
      modal.style.display = "flex";
      modalActionBtn.onclick = action;
    }

    function getCellElement(r, c) {
      return boardEl.children[r * gridSize + c];
    }

    modeBtn.addEventListener("click", () => {
      isFlagMode = !isFlagMode;
      if (isFlagMode) {
        modeBtn.textContent = "MODUS: 🪣 WASSER";
        modeBtn.classList.add("active");
      } else {
        modeBtn.textContent = "MODUS: ⛏️ ABBAUEN";
        modeBtn.classList.remove("active");
      }
    });

    resetBtn.addEventListener("click", () => initGame(true));
    sizeSelector.addEventListener("change", () => initGame(true));

    initGame(true);
  </script>
</body>
</html>
