<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesetze – Suche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="app">
  <header id="hdr">
    <button id="homebtn" class="ib" title="Startseite"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
    <div class="logo"><span class="c1">G</span><span class="c2">e</span><span class="c3">s</span><span class="c1">e</span><span class="c4">t</span><span class="c2">z</span><span class="c3">e</span><span class="logo-sub">Suche</span></div>
    <div class="sbar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="text" placeholder="Paragraph oder Begriff suchen …" autocomplete="off" spellcheck="false">
      <button id="clear" class="ib" title="Leeren"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab active" data-view="all">Alle</button>
    <button class="tab" data-view="merk">Merkliste <span id="merkcount" class="pill">0</span></button>
    <button id="exportmerk" class="gbtn">Merkliste exportieren</button>
    <span id="count" class="count"></span>
  </nav>

  <div class="content-layout">
    <main id="list"></main>
    <aside id="detail" aria-live="polite"></aside>
  </div>
</div>

<div id="landing">
  <div class="hero">
    <div class="hero-logo"><span class="c1">G</span><span class="c2">e</span><span class="c3">s</span><span class="c1">e</span><span class="c4">t</span><span class="c2">z</span><span class="c3">e</span></div>
    <div class="hero-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q2" type="text" placeholder="Gesetze durchsuchen …" autocomplete="off" spellcheck="false">
    </div>
    <div class="hero-btns">
      <button id="searchbtn" class="gbtn big">Suchen</button>
    </div>
    <div id="lawchips" class="chips"></div>
  </div>
</div>

<div id="toast"></div>

<script src="./script.js" defer></script>
</body>
</html>
