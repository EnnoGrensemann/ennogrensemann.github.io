<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesetze – Suche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1a73e8;--link:#1a0dab;--txt:#202124;--sub:#5f6368;--line:#dfe1e5;--mark:#fff1a8}
body{font-family:'Roboto',Arial,sans-serif;background:#fff;color:var(--txt);font-size:14px}
a{color:var(--link)}
/* ---------- Header ---------- */
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid #ebebeb}
.logo{font-size:22px;font-weight:500;letter-spacing:-.5px;white-space:nowrap}
.c1{color:#4285F4}.c2{color:#EA4335}.c3{color:#FBBC05}.c4{color:#34A853}
.logo-sub{font-size:11px;color:var(--sub);margin-left:6px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:1px 5px;vertical-align:middle}
.sbar{flex:1;max-width:690px;display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 8px 0 16px;background:#fff}
.sbar:hover,.sbar:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.sbar svg{width:20px;height:20px;fill:#9aa0a6;flex:none}
.sbar input{flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--txt);min-width:0}
.ib{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:#f1f3f4}
.ib svg{width:20px;height:20px;fill:#5f6368}
.gbtn{border:1px solid var(--line);background:#f8f9fa;color:#3c4043;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
.gbtn:hover{box-shadow:0 1px 2px rgba(60,64,67,.3);border-color:#dadce0}
.gbtn.big{background:var(--blue);color:#fff;border-color:var(--blue);font-size:15px;padding:11px 22px}
.gbtn.big:hover{background:#1b66c9}
/* ---------- Tabs ---------- */
#tabs{position:sticky;top:70px;z-index:40;display:flex;align-items:center;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid #ebebeb}
.tab{border:0;background:none;font-family:inherit;font-size:14px;color:var(--sub);padding:14px 14px 12px;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.pill{background:#e8f0fe;color:var(--blue);border-radius:10px;padding:1px 7px;font-size:12px;margin-left:4px}
.tab.active .pill{background:var(--blue);color:#fff}
.count{margin-left:auto;color:var(--sub);font-size:13px;padding-right:8px;white-space:nowrap}
/* ---------- Layout ---------- */
#app{display:flex;align-items:flex-start}
#toc{width:260px;flex:none;padding:16px 8px 40px 20px;position:sticky;top:122px;max-height:calc(100vh - 130px);display:flex;flex-direction:column}
.toc-h{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.toc-scroll{overflow:auto}
.toc-law{font-weight:700;font-size:13px;margin:16px 0 4px;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:3px}
.toc-teil{font-weight:500;font-size:13px;margin:12px 0 4px;color:var(--txt)}
.toc-abs{font-size:12px;color:var(--sub);margin:8px 0 2px 12px}
.toc-p{display:block;font-size:13px;color:var(--sub);text-decoration:none;padding:3px 0 3px 24px;border-radius:0 16px 16px 0;cursor:pointer}
.toc-p:hover{background:#f1f3f4;color:var(--txt)}
#list{flex:1;max-width:700px;padding:8px 24px 80px;min-width:0}
/* ---------- Ergebnisse ---------- */
.res{padding:18px 4px;border-bottom:1px solid #f1f3f4}
.res.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:#e8f0fe}100%{background:transparent}}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:4px}
.fav{width:20px;height:20px;border-radius:50%;background:#e8f0fe;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex:none}
.lawtag{background:#f1f3f4;border-radius:4px;padding:1px 6px;font-weight:500;color:var(--txt)}
.trow{display:flex;align-items:flex-start;gap:8px}
.ttl{font-size:20px;font-weight:400;flex:1;min-width:0}
.ttl a{color:var(--link);text-decoration:none;cursor:pointer}
.ttl a:hover{text-decoration:underline}
.acts{display:flex;gap:2px;flex:none}
.ib.star.on svg{fill:#fbbc04}
.toggle{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;border-radius:50%;margin-top:2px}
.toggle:hover{background:#f1f3f4}
.toggle svg{width:18px;height:18px;fill:#5f6368;transition:transform .2s}
.res.open .toggle svg{transform:rotate(180deg)}
.body{margin-top:8px;font-size:14px;line-height:1.65;color:#3c4043;display:none}
.res.open .body{display:block}
.body .abs{margin-bottom:12px}
.body ol.liste{margin:6px 0 12px 0;padding-left:26px}
.body ol.liste li{margin-bottom:6px;padding-left:2px}
.body ol.liste ol{margin-top:4px;padding-left:22px;list-style-type:lower-alpha}
.body ol.liste ol ol{list-style-type:lower-roman}
.body .num{font-weight:500;margin-right:4px}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
/* ---------- Empty / Toast ---------- */
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.empty-t{font-size:20px;color:var(--txt);margin-bottom:8px}
/* ---------- Landing ---------- */
#landing{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#fff}
.hero{text-align:center;max-width:640px;width:100%}
.hero-logo{font-size:64px;font-weight:500;letter-spacing:-2px;margin-bottom:28px}
.hero-bar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:28px;padding:0 18px;height:56px;max-width:560px;margin:0 auto 20px;box-shadow:0 1px 6px rgba(32,33,36,.18)}
.hero-bar:focus-within{box-shadow:0 1px 10px rgba(32,33,36,.3)}
.hero-bar svg{width:20px;height:20px;fill:#9aa0a6;flex:none}
.hero-bar input{flex:1;border:0;outline:0;font-size:17px;background:transparent;min-width:0}
.hero-btns{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;min-height:0}
.chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:#dadce0}
.chip.active{background:#e8f0fe;border-color:#e8f0fe;color:var(--blue);font-weight:500}
.chip .n{opacity:.7;font-size:11px;margin-left:4px}
.hint{color:var(--sub);font-size:13px;line-height:1.7}
code{background:#f1f3f4;border-radius:4px;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Responsive ---------- */
@media (max-width:1000px){
  #toc{position:fixed;left:-280px;top:0;bottom:0;background:#fff;z-index:60;box-shadow:2px 0 8px rgba(0,0,0,.15);transition:left .25s;max-height:100vh;padding-top:70px;width:270px}
  #toc.open{left:0}
  #list{padding:8px 16px 80px}
}
@media (min-width:1001px){#tocbtn{display:none}}
</style>

<body>

  <div class="hero">
    <div class="hero-logo"><span class="c1">G</span><span class="c2">e</span><span class="c3">s</span><span class="c1">e</span><span class="c4">t</span><span class="c2">z</span><span class="c3">e</span></div>
    <div class="hero-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>

<script>
'use strict';
var LS_XML='gesetze-xml-v1', LS_MERK='gesetze-merkliste-v1';
var state={laws:[],merk:[],view:'all',query:'',activeLaws:{}};
var dirHandle=null;
var xmlCache={};

/* ---------- Text-Helfer ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escReg(s){return s.replace(/[.*+?^${}()$|\[\]\\]/g,'\\$&');}
function compact(s){return String(s).toLowerCase().replace(/[\s§\-–.,():]/g,'');}
function tokens(q){return String(q).toLowerCase().split(/\s+/).filter(function(t){return t.length>0;});}
function matches(p,q){
  var ts=tokens(q); if(!ts.length) return true;
  var e=compact(p.enbez), ti=(p.titel||'').toLowerCase(), tx=p.text.toLowerCase();
  return ts.every(function(t){
    var tc=compact(t);
    return e.indexOf(tc)>-1 || ti.indexOf(t)>-1 || tx.indexOf(t)>-1;
  });
}
function titleHit(p,q){
  var ti=(p.titel||'').toLowerCase();
  return tokens(q).some(function(t){return ti.indexOf(t)>-1;});
}
function hl(text,q){
  var e=esc(text), ts=tokens(q);
  ts.forEach(function(t){
    var te=esc(t);
    if(te){ e=e.replace(new RegExp('('+escReg(te)+')','gi'),'<mark>$1</mark>'); }
  });
  return e;
}
function hlHTML(html,q){
  var ts=tokens(q);
  if(!ts.length || !html) return html;
  var parts=html.split(/(<[^>]+>)/g);
  for(var i=0;i<parts.length;i++){
    if(parts[i].charAt(0)==='<') continue;
    var seg=parts[i];
    ts.forEach(function(t){
      var te=esc(t);
      if(te){ seg=seg.replace(new RegExp('('+escReg(te)+')','gi'),'<mark>$1</mark>'); }
    });
    parts[i]=seg;
  }
  return parts.join('');
}

/* ---------- XML -> Plain Text ---------- */
function ser(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var c=node.childNodes[i];
    if(c.nodeType===3){ var t=c.nodeValue.replace(/\s+/g,' '); if(t.trim()) out+=t; }
    else if(c.nodeType===1){
      var tag=c.tagName.toLowerCase();
      if(tag==='noindex'||tag==='table'||tag==='tgroup'||tag==='colspec'||tag==='tbody'||tag==='row'||tag==='entry'){continue;}
      if(tag==='br'){out+='\n';continue;}
      if(tag==='p'){out+='\n'+ser(c)+'\n';continue;}
      if(tag==='dl'){
        var dt='';
        for(var j=0;j<c.childNodes.length;j++){
          var d=c.childNodes[j];
          if(d.nodeType!==1) continue;
          var tg=d.tagName.toLowerCase();
          if(tg==='dt'){dt=(d.textContent||'').replace(/\s+/g,' ').trim();}
          else if(tg==='dd'){var dd=ser(d).trim(); if(dd){out+='\n'+(dt?dt+' ':'')+dd+'\n';}}
        }
        continue;
      }
      out+=ser(c);
    }
  }
  return out;
}
function cleanText(s){return s.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();}
function serHTML(node){
  var out='';
  for(var i=0;i<node.childNodes.length;i++){
    var c=node.childNodes[i];
    if(c.nodeType===3){
      var t=c.nodeValue.replace(/\s+/g,' ');
      if(t.trim()) out+=esc(t);
    }
    else if(c.nodeType===1){
      var tag=c.tagName.toLowerCase();
      if(tag==='noindex'||tag==='table'||tag==='tgroup'||tag==='colspec'||tag==='tbody'||tag==='row'||tag==='entry'){continue;}
      if(tag==='br'){out+='<br>';continue;}
      if(tag==='p'){
        var inner=serHTML(c).trim();
        if(inner) out+='<div class="abs">'+inner+'</div>';
        continue;
      }
      if(tag==='dl'){
        out+='<ol class="liste">';
        for(var j=0;j<c.childNodes.length;j++){
          var d=c.childNodes[j];
          if(d.nodeType!==1) continue;
          var tg=d.tagName.toLowerCase();
          if(tg==='dt'){
            var dtText=(d.textContent||'').replace(/\s+/g,' ').trim();
            out+='<li><span class="num">'+esc(dtText)+'</span> ';
          }
          else if(tg==='dd'){ out+=serHTML(d).trim()+'</li>'; }
        }
        out+='</ol>';
        continue;
      }
      out+=serHTML(c);
    }
  }
  return out;
}
function child(el,tag){
  if(!el||!el.children) return null;
  tag=tag.toLowerCase();
  for(var i=0;i<el.children.length;i++){
    if(el.children[i].tagName.toLowerCase()===tag) return el.children[i];
  }
  return null;
}
function parseNorms(xmlText){
  var doc=new DOMParser().parseFromString(xmlText,'text/xml');
  if(doc.getElementsByTagName('parsererror').length){throw new Error('Ungültiges XML');}
  var root=doc.documentElement, paras=[], toc=[], teil='', abschnitt='';
  var norms=root.children;
  for(var i=0;i<norms.length;i++){
    var n=norms[i];
    if(n.tagName.toLowerCase()!=='norm') continue;
    var md=child(n,'metadaten'); if(!md) continue;
    var g=child(md,'gliederungseinheit');
    if(g){
      var kenn=((child(g,'gliederungskennzahl')||{}).textContent||'').trim();
      var bez=((child(g,'gliederungsbez')||{}).textContent||'').trim();
      var gtit=((child(g,'gliederungstitel')||{}).textContent||'').replace(/\s+/g,' ').trim();
      if(kenn.replace(/\s/g,'').length<=3){ teil=(bez+' '+gtit).replace(/\s+/g,' ').trim(); abschnitt=''; toc.push({type:'teil',label:teil}); }
      else { abschnitt=gtit; toc.push({type:'abschnitt',label:gtit,teil:teil}); }
      continue;
    }
    var enbezEl=child(md,'enbez');
    var enbez=enbezEl?enbezEl.textContent.replace(/\s+/g,' ').trim():'';
    if(enbez.charAt(0)!=='§') continue;
    var titEl=child(md,'titel');
    var titel=titEl?titEl.textContent.replace(/\s+/g,' ').trim():'';
    var td=child(n,'textdaten');
    var tx=td?child(td,'text'):null;
    var content=tx?child(tx,'Content'):null;
    var text=content?cleanText(ser(content)):'';
    var html=content?serHTML(content):'';
    var p={doknr:n.getAttribute('doknr')||('p'+i),enbez:enbez,titel:titel,text:text,html:html,teil:teil,abschnitt:abschnitt};
    paras.push(p); toc.push({type:'para',ref:p});
  }
  return {paras:paras,toc:toc};
}

/* ---------- Gesetze verwalten ---------- */
function paraKey(p){return p.lawId+'|'+p.doknr;}
function elId(key){return 'p-'+key.replace(/[^a-z0-9]/gi,'_');}
function buildLaw(xmlText,fileName){
  var m=xmlText.match(/<jurabk>([^<]+)<\/jurabk>/i);
  var name=(m?m[1].trim():fileName.replace(/\.xml$/i,''));
  var r=parseNorms(xmlText);
  var id='law-'+fileName;
  r.paras.forEach(function(p){p.lawId=id;p.lawName=name;});
  return {id:id,name:name,file:fileName,paras:r.paras,toc:r.toc};
}
function addLawsFromTexts(list){ /* list: [{name, text}] */
  var added=0;
  list.forEach(function(item){
    try{
      var law=buildLaw(item.text,item.name);
      xmlCache[item.name]=item.text;
      var idx=-1;
      for(var i=0;i<state.laws.length;i++){ if(state.laws[i].file===item.name){idx=i;break;} }
      if(idx>-1) state.laws[idx]=law; else state.laws.push(law);
      state.activeLaws[law.id]=true;
      added++;
    }catch(e){ console.warn('Übersprungen: '+item.name, e); }
  });
  try{localStorage.setItem(LS_XML,JSON.stringify(xmlCache));}catch(e){}
  if(added) toast(added+' Gesetz(e) geladen – '+totalParas()+' Paragraphen gesamt');
  state.laws.sort(function(a,b){return a.name.localeCompare(b.name);});
  refreshChips(); renderTOC(); renderList(); updateTabs();
}
function totalParas(){ return state.laws.reduce(function(s,l){return s+l.paras.length;},0); }
function activeParas(){
  var out=[];
  state.laws.forEach(function(l){ if(state.activeLaws[l.id]!==false) out=out.concat(l.paras); });
  return out;
}
function saveCache(){ try{localStorage.setItem(LS_XML,JSON.stringify(xmlCache));}catch(e){} }
function loadCache(){
  try{ xmlCache=JSON.parse(localStorage.getItem(LS_XML)||'{}')||{}; }catch(e){ xmlCache={}; }
  var list=Object.keys(xmlCache).map(function(k){return {name:k,text:xmlCache[k]};});
  if(list.length){
    list.forEach(function(item){
      try{
        var law=buildLaw(item.text,item.name);
        state.laws.push(law); state.activeLaws[law.id]=true;
      }catch(e){}
    });
  }
}

/* ---------- Ordner ---------- */
async function pickFolder(){
  if(window.showDirectoryPicker){
    try{ dirHandle=await window.showDirectoryPicker({mode:'read'}); }
    catch(e){ return; }
    await scanFolder();
  } else {
    document.getElementById('dirinput').click();
  }
}
async function scanFolder(){
  if(!dirHandle){ await pickFolder(); return; }
  var perm=await dirHandle.queryPermission({mode:'read'});
  if(perm!=='granted'){ perm=await dirHandle.requestPermission({mode:'read'}); }
  if(perm!=='granted'){ toast('Kein Lesezugriff auf den Ordner'); return; }
  var list=[];
  for await (const entry of dirHandle.values()){
    if(entry.kind==='file' && /\.xml$/i.test(entry.name)){
      try{
        var f=await entry.getFile();
        list.push({name:entry.name,text:await f.text()});
      }catch(e){}
    }
  }
  if(!list.length){ toast('Keine XML-Dateien im Ordner gefunden'); return; }
  state.laws=[]; state.activeLaws={}; xmlCache={};
  addLawsFromTexts(list);
  toast('Ordner aktualisiert: '+state.laws.length+' Gesetze');
}

/* ---------- Icons ---------- */
var SVG={
  star:'<svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
  starBorder:'<svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>',
  chevron:'<svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>'
};
function starSVG(on){return on?SVG.star:SVG.starBorder;}
function headOf(p){return p.titel?p.enbez+' – '+p.titel:p.enbez;}

/* ---------- Rendering ---------- */
function cardHTML(p,q){
  var key=paraKey(p);
  var starred=state.merk.indexOf(key)>-1;
  var sec=p.abschnitt||p.teil||p.lawName;
  return '<article class="res" id="'+elId(key)+'">'
    +'<div class="src"><span class="fav">§</span><span class="lawtag">'+esc(p.lawName)+'</span><span>· '+esc(sec)+'</span></div>'
    +'<div class="trow">'
    +'<button class="toggle" data-toggle="'+key+'" title="Auf-/zuklappen">'+SVG.chevron+'</button>'
    +'<h3 class="ttl"><a href="#" data-toggle="'+key+'">'+hl(headOf(p),q)+'</a></h3>'
    +'<div class="acts">'
    +'<button class="ib copy" data-copy="'+key+'" title="Paragraph kopieren">'+SVG.copy+'</button>'
    +'<button class="ib star'+(starred?' on':'')+'" data-star="'+key+'" title="'+(starred?'Von Merkliste entfernen':'Auf Merkliste')+'">'+starSVG(starred)+'</button>'
    +'</div></div>'
    +'<div class="body">'+hlHTML(p.html,q)+'</div>'
    +'</article>';
}
function renderList(){
  var listEl=document.getElementById('list'); if(!listEl) return;
  var q=state.query.trim();
  var base=(state.view==='merk')?activeParas().filter(function(p){return state.merk.indexOf(paraKey(p))>-1;}):activeParas();
  var shown=base.filter(function(p){return matches(p,q);});
  if(q){
    shown=shown.slice().sort(function(a,b){
      return (titleHit(a,q)?0:1)-(titleHit(b,q)?0:1);
    });
  }
  var html;
  if(state.view==='merk'&&!state.merk.length){
    html='<div class="empty"><div class="empty-t">Noch keine Merkliste</div><div class="empty-s">Tippe auf den Stern bei einem Paragraphen, um ihn hier zu sammeln.</div></div>';
  } else if(!base.length){
    html='<div class="empty"><div class="empty-t">Keine Gesetze ausgewählt</div><div class="empty-s">Aktiviere auf der Startseite mindestens ein Gesetz.</div></div>';
  } else if(!shown.length){
    html='<div class="empty"><div class="empty-t">Keine Ergebnisse</div><div class="empty-s">Versuche z. B. „§ 87“, „Betriebsänderung“ oder „Kündigungsschutz“.</div></div>';
  } else {
    html=shown.map(function(p){return cardHTML(p,q);}).join('');
  }
  listEl.innerHTML=html;
  var c=document.getElementById('count');
  if(c) c.textContent=shown.length+' von '+base.length+' Paragraphen'+(q?' · „'+q+'“':'');
  var mc=document.getElementById('merkcount'); if(mc) mc.textContent=state.merk.length;
}
function renderTOC(){
  var el=document.getElementById('toc'); if(!el) return;
  var h='<div class="toc-h">Inhaltsübersicht</div><div class="toc-scroll">';
  state.laws.forEach(function(law){
    if(state.activeLaws[law.id]===false) return;
    if(!law.toc.length) return;
    h+='<div class="toc-law">'+esc(law.name)+'</div>';
    law.toc.forEach(function(t){
      if(t.type==='teil') h+='<div class="toc-teil">'+esc(t.label)+'</div>';
      else if(t.type==='abschnitt') h+='<div class="toc-abs">'+esc(t.label)+'</div>';
      else h+='<a class="toc-p" data-goto="'+paraKey(t.ref)+'" title="'+esc(t.ref.titel)+'">'+esc(t.ref.enbez)+'</a>';
    });
  });
  el.innerHTML=h+'</div>';
}
function refreshChips(){
  var el=document.getElementById('lawchips'); if(!el) return;
  if(!state.laws.length){ el.innerHTML=''; return; }
  el.innerHTML=state.laws.map(function(l){
    var on=state.activeLaws[l.id]!==false;
    return '<button class="chip'+(on?' active':'')+'" data-law="'+l.id+'">'+esc(l.name)+'<span class="n">'+l.paras.length+'</span></button>';
  }).join('');
}

/* ---------- Merkliste ---------- */
function loadMerk(){try{var m=JSON.parse(localStorage.getItem(LS_MERK)||'[]');state.merk=Array.isArray(m)?m:[];}catch(e){state.merk=[];}}
function saveMerk(){try{localStorage.setItem(LS_MERK,JSON.stringify(state.merk));}catch(e){}}
function updateTabs(){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){tabs[i].classList.toggle('active',tabs[i].getAttribute('data-view')===state.view);}
  var mc=document.getElementById('merkcount'); if(mc) mc.textContent=state.merk.length;
}
function toggleStar(key){
  var i=state.merk.indexOf(key);
  if(i>-1){state.merk.splice(i,1);}else{state.merk.push(key);}
  saveMerk(); renderList(); updateTabs();
}

/* ---------- Navigation ---------- */
function findPara(key){
  var parts=key.split('|');
  for(var i=0;i<state.laws.length;i++){
    if(state.laws[i].id!==parts[0]) continue;
    for(var j=0;j<state.laws[i].paras.length;j++){
      if(state.laws[i].paras[j].doknr===parts[1]) return state.laws[i].paras[j];
    }
  }
  return null;
}
function startSearch(){
  var q2=document.getElementById('q2');
  state.query=q2?q2.value:'';
  var q=document.getElementById('q'); if(q) q.value=state.query;
  document.getElementById('landing').style.display='none';
  document.getElementById('app').style.display='block';
  renderTOC(); renderList(); updateTabs();
  window.scrollTo({top:0});
}
function showLanding(){
  var q=document.getElementById('q'), q2=document.getElementById('q2');
  if(q&&q2) q2.value=q.value;
  document.getElementById('app').style.display='none';
  document.getElementById('landing').style.display='flex';
  refreshChips();
}
function goTo(key){
  var p=findPara(key); if(!p) return;
  state.activeLaws[p.lawId]=true; refreshChips();
  if(state.view!=='all'){state.view='all';updateTabs();}
  if(state.query){state.query='';var q=document.getElementById('q');if(q)q.value='';var q2=document.getElementById('q2');if(q2)q2.value='';}
  renderTOC(); renderList();
  var el=document.getElementById(elId(key));
  if(el){
    el.classList.add('open');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('flash');
    setTimeout(function(){el.classList.remove('flash');},1600);
  }
}

/* ---------- Kopieren / Toast ---------- */
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('In die Zwischenablage kopiert');},function(){fallbackCopy(t);});}
  else fallbackCopy(t);
}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('In die Zwischenablage kopiert');}catch(e){toast('Kopieren nicht möglich');}document.body.removeChild(ta);}
function copyPara(key){var p=findPara(key);if(!p)return;copyText(p.lawName+' – '+p.enbez+(p.titel?' – '+p.titel:'')+'\n\n'+p.text);}
function exportMerk(){
  var lines=state.merk.map(function(k){var p=findPara(k);return p?(p.lawName+' – '+p.enbez+(p.titel?' – '+p.titel:'')):k;});
  copyText(lines.join('\n'));
  toast(lines.length+' Merkliste-Einträge kopiert');
}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- Init ---------- */
function init(){
  loadMerk();
  loadCache();
  refreshChips();
  if(dirHandleSupported()) document.getElementById('refreshbtn').style.display='';
  document.getElementById('refreshbtn2').style.display = state.laws.length ? '' : 'none';

  var q=document.getElementById('q'), q2=document.getElementById('q2');
  q.addEventListener('input',function(){state.query=q.value;q2.value=q.value;renderList();window.scrollTo({top:0,behavior:'smooth'});});
  q2.addEventListener('input',function(){q.value=q2.value;});
  q2.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); startSearch(); } });
  document.getElementById('clear').addEventListener('click',function(){q.value='';q2.value='';state.query='';renderList();q.focus();window.scrollTo({top:0,behavior:'smooth'});});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q&&document.activeElement!==q2){e.preventDefault();(document.getElementById('landing').style.display==='none'?q:q2).focus();}
    if(e.key==='Escape'&&(document.activeElement===q||document.activeElement===q2)){q.value='';q2.value='';state.query='';renderList();}
  });

  document.getElementById('searchbtn').addEventListener('click',startSearch);
  document.getElementById('homebtn').addEventListener('click',showLanding);
  document.getElementById('pickdir').addEventListener('click',pickFolder);
  document.getElementById('refreshbtn').addEventListener('click',scanFolder);
  document.getElementById('refreshbtn2').addEventListener('click',scanFolder);
  document.getElementById('lawchips').addEventListener('click',function(e){
    var c=e.target.closest?e.target.closest('.chip'):null;
    if(!c) return;
    var id=c.getAttribute('data-law');
    state.activeLaws[id]=(state.activeLaws[id]===false)?true:false;
    refreshChips(); renderTOC(); renderList();
  });

  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){tabs[i].addEventListener('click',function(){state.view=this.getAttribute('data-view');updateTabs();renderList();});}

  document.getElementById('list').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button'):null;
    if(b){
      if(b.hasAttribute('data-star')){toggleStar(b.getAttribute('data-star'));return;}
      if(b.hasAttribute('data-copy')){copyPara(b.getAttribute('data-copy'));return;}
      if(b.hasAttribute('data-toggle')){var art=b.closest('.res');if(art)art.classList.toggle('open');return;}
    }
    var a=e.target.closest?e.target.closest('a[data-toggle]'):null;
    if(a){e.preventDefault();var art=a.closest('.res');if(art)art.classList.toggle('open');}
  });
  document.getElementById('toc').addEventListener('click',function(e){
    var a=e.target.closest?e.target.closest('[data-goto]'):null;
    if(a){e.preventDefault();goTo(a.getAttribute('data-goto'));}
  });

  document.getElementById('loadbtn').addEventListener('click',function(){document.getElementById('file').click();});
  document.getElementById('file').addEventListener('change',function(e){
    var fs=e.target.files, list=[];
    var pending=fs.length;
    for(var i=0;i<fs.length;i++){
      (function(f){
        var rd=new FileReader();
        rd.onload=function(){ list.push({name:f.name,text:String(rd.result)}); if(--pending===0){ addLawsFromTexts(list); } };
        rd.onerror=function(){ if(--pending===0) addLawsFromTexts(list); };
        rd.readAsText(f);
      })(fs[i]);
    }
    e.target.value='';
  });
  document.getElementById('dirinput').addEventListener('change',function(e){
    var fs=e.target.files, list=[], pending=fs.length;
    for(var i=0;i<fs.length;i++){
      (function(f){
        if(!/\.xml$/i.test(f.name)){ if(--pending===0) addLawsFromTexts(list); return; }
        var rd=new FileReader();
        rd.onload=function(){ list.push({name:f.name,text:String(rd.result)}); if(--pending===0){ addLawsFromTexts(list); dirHandle=null; document.getElementById('refreshbtn').style.display=dirHandleSupported()?'':'none'; document.getElementById('refreshbtn2').style.display=''; } };
        rd.onerror=function(){ if(--pending===0) addLawsFromTexts(list); };
        rd.readAsText(f);
      })(fs[i]);
    }
    e.target.value='';
  });
  window.addEventListener('dragover',function(e){e.preventDefault();});
  window.addEventListener('drop',function(e){
    e.preventDefault();
    if(!e.dataTransfer||!e.dataTransfer.files.length) return;
    var fs=e.dataTransfer.files, list=[], pending=fs.length;
    for(var i=0;i<fs.length;i++){
      (function(f){
        if(!/\.xml$/i.test(f.name)){ if(--pending===0) addLawsFromTexts(list); return; }
        var rd=new FileReader();
        rd.onload=function(){ list.push({name:f.name,text:String(rd.result)}); if(--pending===0) addLawsFromTexts(list); };
        rd.readAsText(f);
      })(fs[i]);
    }
  });
  var tb=document.getElementById('tocbtn'); if(tb) tb.addEventListener('click',function(){document.getElementById('toc').classList.toggle('open');});
  var ex=document.getElementById('exportmerk'); if(ex) ex.addEventListener('click',exportMerk);

  if(!state.laws.length){ showLanding(); }
  else { renderTOC(); updateTabs(); renderList(); showLanding(); }
}
function dirHandleSupported(){ return !!window.showDirectoryPicker; }
if(typeof document!=='undefined'){document.addEventListener('DOMContentLoaded',init);}
</script>
</body>
</html>
