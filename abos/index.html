<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abo-Übersicht</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fdfcff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <header>
    <div class="top-app-bar" id="appBar">
      <h1 id="appBarTitle">Abo-Übersicht</h1>
      <div class="sync-status" id="syncStatus">
        <span class="material-symbols-outlined" id="syncIcon" style="font-size: 18px;">cloud_done</span>
      </div>
    </div>
  </header>

  <div class="content-area" id="viewDashboard">
    <div id="subsList"></div>
  </div>

  <div class="content-area hidden" id="viewDetail">
    <div class="detail-hero" id="detailHero"></div>
    <div class="member-section-header">
      <span class="member-section-title">Mitglieder</span>
    </div>
    <div id="membersList"></div>
    <div class="footer-actions">
      <button class="m3-btn-tonal" onclick="openAddMemberModal()">
        <span class="material-symbols-outlined">person_add</span> Person hinzufügen
      </button>
      <button class="m3-btn-danger" onclick="deleteCurrentSubscription()">
        <span class="material-symbols-outlined">delete</span> Abo löschen
      </button>
    </div>
  </div>

  <div class="content-area hidden" id="viewMemberDetail">
    <div class="detail-hero" id="memberHero"></div>
    <div class="member-section-header">
      <span class="member-section-title" id="yearSectionTitle">Monatsübersicht 2026</span>
    </div>
    <div class="month-grid" id="monthGrid"></div>
    <div class="footer-actions">
      <button class="m3-btn-danger" onclick="deleteCurrentMember()">
        <span class="material-symbols-outlined">person_remove</span> Person aus Abo entfernen
      </button>
    </div>
  </div>

  <button class="fab" id="fabBtn" onclick="openAddSubModal()">
    <span class="material-symbols-outlined">add</span>
  </button>
</div>

<div class="modal-backdrop hidden" id="subModal">
  <div class="modal-sheet">
    <h3>Neues Abo</h3>
    <div class="m3-field">
      <label>Name des Dienstes</label>
      <input type="text" id="subName" placeholder="z. B. Disney+">
    </div>
    <div class="m3-field">
      <label>Gesamtbetrag (€)</label>
      <input type="number" id="subCost" step="0.01" placeholder="14.99">
    </div>
    <div class="m3-field">
      <label>Abrechnungsintervall</label>
      <select id="subInterval">
        <option value="monthly">Monatlich</option>
        <option value="yearly">Jährlich</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="btn-text" onclick="closeModals()">Abbrechen</button>
      <button class="btn-filled" onclick="saveSubscription()">Speichern</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="memberModal">
  <div class="modal-sheet">
    <h3>Person hinzufügen</h3>
    <div class="m3-field">
      <label>Name</label>
      <input type="text" id="memberName" placeholder="z. B. Alex">
    </div>
    <div class="m3-field">
      <label>Zahlungsintervall der Person</label>
      <select id="memberInterval">
        <option value="monthly">Monatlich</option>
        <option value="yearly">Jährlich</option>
      </select>
    </div>
    <div class="m3-field">
      <label>Rolle</label>
      <select id="memberType">
        <option value="member">Zahlendes Mitglied</option>
        <option value="dummy">Dummy (Profil ohne Zahlung)</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="btn-text" onclick="closeModals()">Abbrechen</button>
      <button class="btn-filled" onclick="saveMember()">Hinzufügen</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
