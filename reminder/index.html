<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Erinnerungs-Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f4f6;
      --surface-hover: #eaecef;
      --surface-elevated: #ffffff;
      --border: #e4e4e7;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --accent-soft: rgba(26, 115, 232, 0.1);
      --danger: #ef4444;
      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 24px 48px -12px rgba(0, 0, 0, 0.25);
      --backdrop: rgba(0, 0, 0, 0.45);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --surface: #1c1c1f;
        --surface-hover: #26262a;
        --surface-elevated: #1c1c1f;
        --border: #2c2c31;
        --text-primary: #f4f4f5;
        --text-secondary: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.15);
        --danger: #f87171;
        --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.35);
        --shadow-modal: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
        --backdrop: rgba(0, 0, 0, 0.72);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .notify-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .notify-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .notify-btn.granted {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }

    .message-input {
      width: 100%;
      background: var(--surface);
      color: var(--text-primary);
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .message-input::placeholder {
      color: var(--text-secondary);
    }

    .message-input:focus {
      background: var(--surface-elevated);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .time-btn {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .time-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .time-btn:active {
      transform: scale(0.96);
    }

    .timers-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .timer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
    }

    .timer-list::-webkit-scrollbar {
      width: 4px;
    }

    .timer-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .timer-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .timer-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .timer-text {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    .timer-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .timer-countdown {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      white-space: nowrap;
    }

    .cancel-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
    }

    .cancel-btn:hover {
      background: var(--surface);
      color: var(--danger);
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--surface);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px 24px;
      box-shadow: var(--shadow-modal);
      text-align: center;
      transform: scale(0.94) translateY(8px);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .modal-message {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .modal-close-btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .modal-close-btn:hover {
      background: var(--accent-hover);
    }

    .modal-close-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="top-bar">
      <h1 class="app-title">Erinnerung</h1>
      <button type="button" id="notifyBtn" class="notify-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="notifyLabel">Pop-ups</span>
      </button>
    </header>

    <section class="controls-section">
      <input
        type="text"
        id="messageInput"
        class="message-input"
        placeholder="Woran möchtest du erinnert werden?"
        autocomplete="off"
      >
      <div class="time-grid" id="timeButtons">
        <button type="button" class="time-btn" data-hours="0.5">0,5 Std.</button>
        <button type="button" class="time-btn" data-hours="1">1 Std.</button>
        <button type="button" class="time-btn" data-hours="1.5">1,5 Std.</button>
        <button type="button" class="time-btn" data-hours="2">2 Std.</button>
        <button type="button" class="time-btn" data-hours="2.5">2,5 Std.</button>
        <button type="button" class="time-btn" data-hours="3">3 Std.</button>
      </div>
    </section>

    <section class="timers-section">
      <div class="section-header">
        <span>Aktive Timer</span>
        <span id="timerCount">0</span>
      </div>
      <div class="timer-list" id="timerList"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="popupBackdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div class="modal-label">Erinnerung</div>
      <div class="modal-message" id="popupMessage"></div>
      <div class="modal-sub" id="popupSub"></div>
      <button type="button" class="modal-close-btn" id="popupCloseBtn">Schließen</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'minimal_timers_v1';
    const messageInput = document.getElementById('messageInput');
    const timeButtons = document.getElementById('timeButtons');
    const timerList = document.getElementById('timerList');
    const timerCount = document.getElementById('timerCount');
    const notifyBtn = document.getElementById('notifyBtn');
    const notifyLabel = document.getElementById('notifyLabel');
    const popupBackdrop = document.getElementById('popupBackdrop');
    const popupMessage = document.getElementById('popupMessage');
    const popupSub = document.getElementById('popupSub');
    const popupCloseBtn = document.getElementById('popupCloseBtn');

    let timers = [];
    let popupQueue = [];

    function loadTimers() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        timers = raw ? JSON.parse(raw) : [];
      } catch {
        timers = [];
      }
    }

    function saveTimers() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
    }

    function formatRemaining(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function formatClockTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString('de-DE', {
        hour: '2-digit',
        minute: '2-digit'
      }) + ' Uhr';
    }

    function createTimer(hours) {
      const text = messageInput.value.trim() || `Erinnerung (${String(hours).replace('.', ',')} Std.)`;
      const now = Date.now();
      const durationMs = hours * 3600 * 1000;
      timers.push({
        id: `${now}-${Math.random().toString(36).slice(2, 7)}`,
        text,
        createdAt: now,
        endTime: now + durationMs,
        durationMs
      });
      timers.sort((a, b) => a.endTime - b.endTime);
      saveTimers();
      messageInput.value = '';
      renderTimers();
    }

    function removeTimer(id) {
      timers = timers.filter((t) => t.id !== id);
      saveTimers();
      renderTimers();
    }

    function triggerNotification(timer) {
      popupQueue.push(timer);
      if (!popupBackdrop.classList.contains('active')) {
        showNextPopup();
      }
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('Erinnerung', {
            body: timer.text,
            silent: true
          });
        } catch {}
      }
    }

    function showNextPopup() {
      if (popupQueue.length === 0) {
        popupBackdrop.classList.remove('active');
        return;
      }
      const current = popupQueue.shift();
      popupMessage.textContent = current.text;
      popupSub.textContent = `Fällig um ${formatClockTime(current.endTime)}`;
      popupBackdrop.classList.add('active');
    }

    function checkExpiredTimers() {
      const now = Date.now();
      const active = [];
      let changed = false;

      for (const timer of timers) {
        if (timer.endTime <= now) {
          triggerNotification(timer);
          changed = true;
        } else {
          active.push(timer);
        }
      }

      if (changed) {
        timers = active;
        saveTimers();
      }
      renderTimers();
    }

    function renderTimers() {
      const now = Date.now();
      timerCount.textContent = String(timers.length);

      if (timers.length === 0) {
        timerList.innerHTML = '<div class="empty-state">Keine aktiven Timer</div>';
        return;
      }

      timerList.innerHTML = timers.map((timer) => {
        const remaining = Math.max(0, timer.endTime - now);
        const progress = Math.min(100, Math.max(0, ((timer.durationMs - remaining) / timer.durationMs) * 100));
        return `
          <div class="timer-card">
            <div class="timer-card-top">
              <div>
                <div class="timer-text">${escapeHtml(timer.text)}</div>
                <div class="timer-meta">
                  <span>Fällig um ${formatClockTime(timer.endTime)}</span>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="timer-countdown">${formatRemaining(remaining)}</span>
                <button type="button" class="cancel-btn" data-remove="${timer.id}" aria-label="Timer löschen">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${progress}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function updateNotifyButton() {
      if (!('Notification' in window)) {
        notifyBtn.style.display = 'none';
        return;
      }
      if (Notification.permission === 'granted') {
        notifyBtn.classList.add('granted');
        notifyLabel.textContent = 'Pop-ups aktiv';
      } else if (Notification.permission === 'denied') {
        notifyLabel.textContent = 'Blockiert';
      } else {
        notifyLabel.textContent = 'Pop-ups';
      }
    }

    notifyBtn.addEventListener('click', async () => {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') {
        await Notification.requestPermission();
        updateNotifyButton();
      }
    });

    timeButtons.addEventListener('click', (e) => {
      const btn = e.target.closest('.time-btn');
      if (!btn) return;
      const hours = parseFloat(btn.dataset.hours);
      if (!Number.isNaN(hours)) {
        createTimer(hours);
      }
    });

    timerList.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      removeTimer(btn.dataset.remove);
    });

    popupCloseBtn.addEventListener('click', showNextPopup);

    popupBackdrop.addEventListener('click', (e) => {
      if (e.target === popupBackdrop) {
        showNextPopup();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        checkExpiredTimers();
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    loadTimers();
    updateNotifyButton();
    checkExpiredTimers();
    setInterval(checkExpiredTimers, 1000);
  </script>
</body>
</html>
